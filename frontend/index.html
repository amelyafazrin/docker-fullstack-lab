<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Fullstack Persistent Storage Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        h1, h2 {
            color: #002b49;
        }
        .status {
            background: #eef6ff;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1a4971;
        }
        .status.error {
            background: #ffeef0;
            color: #b81423;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background: #1867c0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1456a0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #1867c0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Docker Fullstack Persistent Storage Lab</h1>
        <div id="status" class="status">Menghubungkan ke backend...</div>

        <h2>Pesan tersimpan</h2>
        <form id="messageForm" class="form-group">
            <input type="text" id="messageInput" placeholder="Tulis pesan untuk disimpan..." required>
            <button type="submit">Simpan pesan</button>
        </form>

        <ul id="messagesList"></ul>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messagesList = document.getElementById('messagesList');

        async function fetchMessages() {
            try {
                const res = await fetch('/api/');
                if (!res.ok) throw new Error('Gagal mengambil data');
                const data = await res.json();
                
                statusDiv.className = 'status';
                statusDiv.textContent = 'Terhubung ke backend!';
                
                messagesList.innerHTML = '';
                if (data.length === 0) {
                    messagesList.innerHTML = '<li>Belum ada pesan tersimpan.</li>';
                } else {
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item.message;
                        messagesList.appendChild(li);
                    });
                }
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Koneksi backend gagal: Failed to fetch';
                messagesList.innerHTML = '<li>Tidak dapat mengambil pesan. Periksa container backend.</li>';
            }
        }

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            try {
                const res = await fetch('/api/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (res.ok) {
                    messageInput.value = '';
                    fetchMessages();
                }
            } catch (err) {
                alert('Gagal menyimpan pesan!');
            }
        });

        fetchMessages();
    </script>
</body>
</html>
