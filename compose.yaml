services:
  backend:
    build: ./backend
    ports:
      - "8081:5000"
    volumes:
      - backend-db-data:/var/lib/backend_data
    networks:
      - fullstack-net
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - fullstack-net
    restart: unless-stopped

networks:
  fullstack-net:
    driver: bridge

volumes:
  backend-db-data: