@'
services:
  backend:
    build: ./backend
    ports:
      - "8081:5000"
    volumes:
      - backend-db-data:/var/lib/backend_data
    networks:
      - fullstack-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - fullstack-net
    restart: unless-stopped

networks:
  fullstack-net:
    driver: bridge

volumes:
  backend-db-data:
'@ | Set-Content compose.yaml